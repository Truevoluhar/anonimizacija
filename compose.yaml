name: document-anonymizer
services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "8085:8080"
    volumes:
      - service_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  service_data:
